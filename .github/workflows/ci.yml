name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      # Synth against a dummy account. Catches broken constructs, bad IAM
      # policy JSON, and cross-stack wiring without touching AWS.
      - name: CDK synth
        run: |
          cdk synth --all \
            --context account=111111111111 \
            --context region=eu-west-1

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orchestrator, retriever, ingestion]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only. Proves the Dockerfile and requirements resolve;
      # pushing needs AWS creds and a live ECR repo.
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max